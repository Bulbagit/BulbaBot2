name: Deploy to Production
on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: BulbaBot deployment
    runs-on: ubuntu-latest

    steps:
      - name: Update BulbaBot to the latest code
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # Stop execution if anything fails
            set -e
            
            cd /home/ubuntu/BulbaBot2
            
            echo "Updating BulbaBot..."
            git pull origin master
            
            echo "BulbaBot updated. Installing dependencies..."
            npm ci
            
            echo "Dependencies installed. Backing up database..."
            mysqldump bulbabot --no-tablespaces > backups/bulbabot_$(date +%Y-%m-%d_%H-%M-%S).sql
            
            echo "Database backup complete. Running migrations..."
            npm run db:migrate
            
            echo "Migrations complete. Restarting..."
            sudo /bin/systemctl restart bulbabot
            
            echo "Deployment complete."